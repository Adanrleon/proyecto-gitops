apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-refresh-argocd
  namespace: argocd
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  resourceNames: ["app-gitops"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-refresh-argocd
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: default
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-refresh-argocd
