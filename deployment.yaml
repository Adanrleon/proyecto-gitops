apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mi-app
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      containers:
      - name: contenedor-web
        image: localhost:5001/mi-app:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80